.feat-section-body .selection-item.disabled {

                <span class="step-label">角色详情</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="16" data-default-label="完成">
                <span class="step-num">16</span>
                <span class="step-label">完成</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="17" data-default-label="保存">
                <span class="step-num">17</span>
                <span class="step-label">保存</span>
            </div>
        </div>

        <!-- ===== 步骤内容容器 ===== -->
        <div class="step-content" id="stepContent">
        <div class="bonus-step">
            <div class="ability-header">
                <h2>背景加值</h2>
                <label class="unbind-toggle " onclick="toggleUnbind('bonus')">
                    <span class="unbind-icon">🔓</span> 解绑属性
                </label>
                <span class="unbind-hint">请先与你的DM商议后再决定是否解绑</span>
            </div>

            <div class="bonus-desc">你的背景「贵族」提供了以下属性：<strong>力量、智力、魅力</strong></div>

            <div class="bonus-mode-select">
                <span class="bonus-mode-text">选两个不同的属性 +2、+1，或不同的属性各 +1</span>
            </div>

            <div class="bonus-assign">
                
                        <div class="bonus-row">
                            <span class="bonus-label">力量</span>
                            <div class="bonus-controls">
                                <button class="bonus-btn" onclick="adjustBonus(1, -1)">−</button>
                                <span class="bonus-value">+1</span>
                                <button class="bonus-btn" onclick="adjustBonus(1, 1)">+</button>
                            </div>
                            <span class="bonus-preview">17 → 18</span>
                        </div>
                    
                        <div class="bonus-row">
                            <span class="bonus-label">智力</span>
                            <div class="bonus-controls">
                                <button class="bonus-btn" onclick="adjustBonus(11, -1)">−</button>
                                <span class="bonus-value">+1</span>
                                <button class="bonus-btn" onclick="adjustBonus(11, 1)">+</button>
                            </div>
                            <span class="bonus-preview">13 → 14</span>
                        </div>
                    
                        <div class="bonus-row">
                            <span class="bonus-label">魅力</span>
                            <div class="bonus-controls">
                                <button class="bonus-btn" onclick="adjustBonus(25, -1)">−</button>
                                <span class="bonus-value">+1</span>
                                <button class="bonus-btn" onclick="adjustBonus(25, 1)">+</button>
                            </div>
                            <span class="bonus-preview">11 → 12</span>
                        </div>
                    
            </div>

            <div class="bonus-total">已分配：3 / 3</div>
        </div>
    </div>

        <!-- ===== 底部按钮 ===== -->
        <div class="step-footer">
            <button id="prevBtn" class="btn btn-secondary" style="visibility: visible;">← 上一步</button>
            <div class="step-footer-center">
                <span id="stepIndicator" class="step-indicator" style="">第 8 步，共 17 步</span>
            </div>
            <button id="nextBtn" class="btn btn-primary" style="visibility: visible;">下一步 →</button>
        </div>

    </div>

    <!-- ===== 选择弹窗模态框（供工具/法术等条件筛选选择使用） ===== -->
    <div class="selection-modal-overlay" id="selectionModalOverlay" style="display:none;">
        <div class="selection-modal" id="selectionModalContent">
            <div class="selection-modal-header">
                <h3 class="selection-modal-title" id="selectionModalTitle">请选择</h3>
                <button class="selection-modal-close" id="selectionModalClose">✕</button>
            </div>
            <div class="selection-modal-body" id="selectionModalBody">
                <!-- 内容由JS动态填充 -->
            </div>
            <div class="selection-modal-footer">
                <div class="selection-modal-hint" id="selectionModalHint">已选：0 / 0</div>
                <button class="btn btn-secondary" id="selectionModalCancel">取消</button>
                <button class="btn btn-primary" id="selectionModalConfirm">确认</button>
            </div>
        </div>
    </div>


</body></html>
