                <label class="details-label">语言 <span class="details-hint">选择3种语言</span></label>

                    <div class="language-tag selected" data-lang-id="1" data-granted="false" onclick="toggleLanguage(1, this)">通用语</div><div class="language-tag selected" data-lang-id="2" data-granted="false" onclick="toggleLanguage(2, this)">通用手语</div><div class="language-tag selected" data-lang-id="3" data-granted="false" onclick="toggleLanguage(3, this)">龙语</div><div class="language-tag " data-lang-id="4" data-granted="false" onclick="toggleLanguage(4, this)">矮人语</div><div class="language-tag " data-lang-id="5" data-granted="false" onclick="toggleLanguage(5, this)">精灵语</div><div class="language-tag " data-lang-id="6" data-granted="false" onclick="toggleLanguage(6, this)">巨人语</div><div class="language-tag " data-lang-id="7" data-granted="false" onclick="toggleLanguage(7, this)">侏儒语</div><div class="language-tag " data-lang-id="8" data-granted="false" onclick="toggleLanguage(8, this)">地精语</div><div class="language-tag " data-lang-id="9" data-granted="false" onclick="toggleLanguage(9, this)">半身人语</div><div class="language-tag " data-lang-id="10" data-granted="false" onclick="toggleLanguage(10, this)">兽人语</div><div class="language-tag " data-lang-id="11" data-granted="false" onclick="toggleLanguage(11, this)">深渊语</div><div class="language-tag " data-lang-id="12" data-granted="false" onclick="toggleLanguage(12, this)">天界语</div><div class="language-tag " data-lang-id="13" data-granted="false" onclick="toggleLanguage(13, this)">深潜语</div><div class="language-tag " data-lang-id="14" data-granted="false" onclick="toggleLanguage(14, this)">德鲁伊语</div><div class="language-tag " data-lang-id="15" data-granted="false" onclick="toggleLanguage(15, this)">炼狱语</div><div class="language-tag " data-lang-id="16" data-granted="false" onclick="toggleLanguage(16, this)">原初语</div><div class="language-tag " data-lang-id="17" data-granted="false" onclick="toggleLanguage(17, this)">木族语</div><div class="language-tag " data-lang-id="18" data-granted="false" onclick="toggleLanguage(18, this)">盗贼黑话</div><div class="language-tag " data-lang-id="19" data-granted="false" onclick="toggleLanguage(19, this)">地底通用语</div>
                </div>
                <div class="language-counter" id="languageCounter">已选择 3 / 3</div>
            </div>

            <!-- 个人特点 -->
            <div class="details-field details-field-full">
                    <label class="details-label">个人特点</label>
                    <textarea class="details-textarea" id="detailTraits" placeholder="描述你的角色的性格特点、习惯、怪癖等..." oninput="saveDetailField('personalTraits', this.value)"></textarea>
                </div>

                <!-- 理想 -->
                <div class="details-field details-field-full">
                    <label class="details-label">理想</label>
                    <textarea class="details-textarea" id="detailIdeals" placeholder="你的角色相信什么？追求什么？" oninput="saveDetailField('ideals', this.value)"></textarea>
                </div>

                <!-- 羁绊/心结 -->
                <div class="details-field details-field-full">
                    <label class="details-label">羁绊 / 心结</label>
                    <textarea class="details-textarea" id="detailBonds" placeholder="角色在乎的人、事、物，或无法释怀的过去..." oninput="saveDetailField('bonds', this.value)"></textarea>
                </div>

                <!-- 缺点 -->
                <div class="details-field details-field-full">
                    <label class="details-label">缺点</label>
                    <textarea class="details-textarea" id="detailFlaws" placeholder="角色的恐惧、弱点、不良习惯..." oninput="saveDetailField('flaws', this.value)"></textarea>
                </div>

                <!-- 背景故事 -->
                <div class="details-field details-field-full">
                    <label class="details-label">背景故事</label>
                    <textarea class="details-textarea details-textarea-lg" id="detailBackstory" placeholder="写下角色的过往经历、冒险动机..." oninput="saveDetailField('backstory', this.value)"></textarea>
                </div>
            </div>
        </div>
    </div>

        <!-- ===== 底部按钮 ===== -->
        <div class="step-footer">
            <button id="prevBtn" class="btn btn-secondary" style="visibility: visible;">← 上一步</button>
            <div class="step-footer-center">
                <span id="stepIndicator" class="step-indicator" style="">第 14 步，共 16 步</span>
            </div>
            <button id="nextBtn" class="btn btn-primary" style="visibility: visible;">下一步 →</button>
        </div>

    </div>

    <!-- ===== 选择弹窗模态框（供工具/法术等条件筛选选择使用） ===== -->
    <div class="selection-modal-overlay" id="selectionModalOverlay" style="display:none;">
        <div class="selection-modal" id="selectionModalContent">
            <div class="selection-modal-header">
                <h3 class="selection-modal-title" id="selectionModalTitle">请选择</h3>
                <button class="selection-modal-close" id="selectionModalClose">✕</button>
            </div>
            <div class="selection-modal-body" id="selectionModalBody">
                <!-- 内容由JS动态填充 -->
            </div>
            <div class="selection-modal-footer">
                <div class="selection-modal-hint" id="selectionModalHint">已选：0 / 0</div>
                <button class="btn btn-secondary" id="selectionModalCancel">取消</button>
                <button class="btn btn-primary" id="selectionModalConfirm">确认</button>
            </div>
        </div>
    </div>


</body></html>
