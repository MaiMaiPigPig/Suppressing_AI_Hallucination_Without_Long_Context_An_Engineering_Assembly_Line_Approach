<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事助手 · 跑团工具</title>
    <link rel="stylesheet" href="index/index.css">
    <script src="index/index.js" defer></script>
</head>
<body>
    
    <div class="container">
        <!-- 顶部装饰线 -->
        <div class="top-ornament"></div>

        <!-- 标题区 -->
        <header class="header">
            <div class="logo-icon">🎲</div>
            <h1>故事助手</h1>
            <p class="tagline">让跑团更简单 · 让故事更精彩</p>
        </header>

        <!-- 主卡片 -->
        <main class="main-card">
            <!-- 规则选择器 -->

            <!-- 开始按钮（大、醒目） -->
            <button id="startBtn" class="btn btn-start">
                <span class="btn-icon">🚀</span>
                开始冒险
            </button>

            <!-- 辅助功能按钮组（许愿池 + 纠错） -->
            <div class="action-group">
                <button id="wishBtn" class="btn btn-wish">
                    <span class="btn-icon">🌟</span>
                    许愿池
                </button>
                <button id="reportBtn" class="btn btn-report">
                    <span class="btn-icon">📝</span>
                    纠错反馈
                </button>
            </div>


        </main>

        <!-- 底部 -->
        <footer class="footer">
            <p>© 2026 故事助手 · 灵感源自 DND</p>
        </footer>

        <!-- 底部装饰线 -->
        <div class="bottom-ornament"></div>
    </div>
</body>
</html>
