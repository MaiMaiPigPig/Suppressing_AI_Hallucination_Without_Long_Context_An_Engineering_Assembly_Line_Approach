 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND 5R · 角色卡生成</title>
    <base href="/character/dnd_5r/creation/">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/race.css">
    <link rel="stylesheet" href="styles/ability.css">
    <link rel="stylesheet" href="styles/skill.css">
    <link rel="stylesheet" href="styles/bonus.css">
    <link rel="stylesheet" href="styles/feat.css">
    <link rel="stylesheet" href="styles/shop.css">
    <link rel="stylesheet" href="styles/details.css">
    <link rel="stylesheet" href="styles/spell.css">
    <link rel="stylesheet" href="styles/sheet.css">
    <style>
        /* 欢迎页样式 */
        .start-step {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            height: 100%;
        }
        .start-content {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .start-logo {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        .start-title {
            font-size: 2.2rem;
            color: #f0e6d3;
            margin: 0 0 8px;
            font-weight: 700;
        }
        .start-desc {
            font-size: 1rem;
            color: #a89b8c;
            margin-bottom: 40px;
        }
        .start-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .start-card {
            flex: 1;
            min-width: 200px;
            max-width: 260px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 32px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .start-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(201,168,76,0.35);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .start-card-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .start-card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f0e6d3;
            margin-bottom: 8px;
        }
        .start-card-desc {
            font-size: 0.85rem;
            color: #8a7a6a;
            line-height: 1.4;
        }
        /* 导出步骤样式 */
        .export-step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            height: 100%;
        }
        .export-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .export-header h2 {
            font-size: 2rem;
            color: #f0e6d3;
            margin: 0 0 8px;
        }
        .export-subtitle {
            font-size: 1rem;
            color: #a89b8c;
        }
        .export-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .export-card {
            flex: 1;
            min-width: 220px;
            max-width: 280px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 24px 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .export-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(201,168,76,0.35);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .export-card-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .export-card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f0e6d3;
            margin-bottom: 6px;
        }
        .export-card-desc {
            font-size: 0.8rem;
            color: #8a7a6a;
            line-height: 1.4;
        }
        .upgrade-card {
            border-color: rgba(201,168,76,0.25);
            background: rgba(201,168,76,0.06);
        }
        .upgrade-card:hover {
            border-color: #c9a84c;
            background: rgba(201,168,76,0.12);
            box-shadow: 0 8px 24px rgba(201,168,76,0.2);
        }
        .upgrade-card .export-card-title {
            color: #f0d878;
        }
        .export-info {
            max-width: 500px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 18px 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .export-info-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f0e6d3;
            margin-bottom: 10px;
        }
        .export-info ul {
            margin: 0;
            padding-left: 18px;
        }
        .export-info li {
            font-size: 0.85rem;
            color: #a89b8c;
            line-height: 1.6;
            margin-bottom: 4px;
        }
        /* 导出摘要样式 */
        .export-summary {
            max-width: 500px;
            width: 100%;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 18px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
        }
        .export-summary-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f0e6d3;
            margin-bottom: 10px;
        }
        .export-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
        }
        .export-summary-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .export-summary-item-wide {
            grid-column: 1 / -1;
        }
        .export-summary-label {
            font-size: 0.7rem;
            color: #8a7a6a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .export-summary-value {
            font-size: 0.9rem;
            color: #f0e6d3;
        }
        /* DLC选择步骤样式 */
        .dlc-step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            height: 100%;
        }
        .dlc-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .dlc-header h2 {
            font-size: 1.8rem;
            color: #f0e6d3;
            margin: 0 0 8px;
        }
        .dlc-header p {
            font-size: 0.95rem;
            color: #a89b8c;
            margin: 0;
        }
        .dlc-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 32px;
        }
        .dlc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 16px 20px;
            transition: border-color 0.2s;
        }
        .dlc-item:hover {
            border-color: rgba(201,168,76,0.3);
        }
        .dlc-info {
            flex: 1;
        }
        .dlc-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f0e6d3;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dlc-badge {
            font-size: 0.7rem;
            background: rgba(201,168,76,0.15);
            color: #c9a84c;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .dlc-desc {
            font-size: 0.85rem;
            color: #a89b8c;
        }
        .dlc-status {
            flex-shrink: 0;
            margin-left: 16px;
        }
        .dlc-status-on {
            font-size: 0.85rem;
            color: #4caf50;
            font-weight: 600;
            background: rgba(76,175,80,0.1);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(76,175,80,0.2);
        }
        .dlc-footer {
            text-align: center;
        }
    </style>
    <!-- PDF 导出依赖：html2canvas（HTML→Canvas）+ jsPDF（Canvas→PDF） -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <!-- 规则解析引擎（ES Module，通过 window.handlers 全局桥接兼容旧代码） -->
    <script type="module" src="../handlers/index.js"></script>
    <script type="module" src="../handlers/data-query.js"></script>
    <!-- flow 函数窗口桥接 -->
    <script type="module" src="flow/bridge.js"></script>
    <!-- ES Module 入口 -->
    <script type="module" src="app.js?v=20260914"></script>
</head>
<body>

    <div class="container">
        <!-- ===== 顶部导航 ===== -->
        <nav class="nav-bar">
            <a href="/character" class="nav-back">← 返回规则选择</a>
            <span class="nav-title">DND 5R 角色卡生成</span>
            <div class="nav-actions">
                <!-- 货币显示 -->
                <div class="currency-display">
                    <span class="currency-item"><span class="coin coin-pp"></span> <input type="number" id="platinum" value="0" min="0" readonly> <label>PP</label></span>
                    <span class="currency-item"><span class="coin coin-gp"></span> <input type="number" id="gold" value="0" min="0" readonly> <label>GP</label></span>
                    <span class="currency-item"><span class="coin coin-sp"></span> <input type="number" id="silver" value="0" min="0" readonly> <label>SP</label></span>
                    <span class="currency-item"><span class="coin coin-cp"></span> <input type="number" id="copper" value="0" min="0" readonly> <label>CP</label></span>
                    <span class="currency-rate" title="兑率：1PP=10GP | 1GP=10SP | 1SP=10CP">ⓘ</span>
                </div>
                <button id="resetBtn" class="btn btn-secondary">↺ 重置</button>
            </div>
        </nav>

        <!-- ===== 步骤进度条 ===== -->
        <div class="step-progress" id="stepProgress">
            <div class="step-item active" data-step="1" data-default-label="种族">
                <span class="step-num">1</span>
                <span class="step-label">种族</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="2" data-default-label="亚种">
                <span class="step-num">2</span>
                <span class="step-label">亚种</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="3" data-default-label="职业">
                <span class="step-num">3</span>
                <span class="step-label">职业</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="4" data-default-label="职业套装">
                <span class="step-num">4</span>
                <span class="step-label">职业套装</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="5" data-default-label="背景">
                <span class="step-num">5</span>
                <span class="step-label">背景</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="6" data-default-label="背景套装">
                <span class="step-num">6</span>
                <span class="step-label">背景套装</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="7" data-default-label="基础属性">
                <span class="step-num">7</span>
                <span class="step-label">基础属性</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="8" data-default-label="背景加值">
                <span class="step-num">8</span>
                <span class="step-label">背景加值</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="9" data-default-label="技能">
                <span class="step-num">9</span>
                <span class="step-label">技能</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="10" data-default-label="专长">
                <span class="step-num">10</span>
                <span class="step-label">专长</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="11" data-default-label="法术">
                <span class="step-num">11</span>
                <span class="step-label">法术</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="12" data-default-label="商城">
                <span class="step-num">12</span>
                <span class="step-label">商城</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="13" data-default-label="特性总览">
                <span class="step-num">13</span>
                <span class="step-label">特性总览</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="14" data-default-label="角色详情">
                <span class="step-num">14</span>
                <span class="step-label">角色详情</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="15" data-default-label="完成">
                <span class="step-num">15</span>
                <span class="step-label">完成</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" data-step="16" data-default-label="保存">
                <span class="step-num">16</span>
                <span class="step-label">保存</span>
            </div>
        </div>

        <!-- ===== 步骤内容容器 ===== -->
        <div class="step-content" id="stepContent">
            <!-- 步骤内容由 JS 动态渲染 -->
        </div>

        <!-- ===== 底部按钮 ===== -->
        <div class="step-footer">
            <button id="prevBtn" class="btn btn-secondary" style="visibility: hidden;">← 上一步</button>
            <div class="step-footer-center">
                <span id="stepIndicator" class="step-indicator">第 1 步，共 7 步</span>
            </div>
            <button id="nextBtn" class="btn btn-primary">下一步 →</button>
        </div>

    </div>

    <!-- ===== 选择弹窗模态框（供工具/法术等条件筛选选择使用） ===== -->
    <div class="selection-modal-overlay" id="selectionModalOverlay" style="display:none;">
        <div class="selection-modal" id="selectionModalContent">
            <div class="selection-modal-header">
                <h3 class="selection-modal-title" id="selectionModalTitle">请选择</h3>
                <button class="selection-modal-close" id="selectionModalClose">✕</button>
            </div>
            <div class="selection-modal-body" id="selectionModalBody">
                <!-- 内容由JS动态填充 -->
            </div>
            <div class="selection-modal-footer">
                <div class="selection-modal-hint" id="selectionModalHint">已选：0 / 0</div>
                <button class="btn btn-secondary" id="selectionModalCancel">取消</button>
                <button class="btn btn-primary" id="selectionModalConfirm">确认</button>
            </div>
        </div>
    </div>

</body>
</html>
