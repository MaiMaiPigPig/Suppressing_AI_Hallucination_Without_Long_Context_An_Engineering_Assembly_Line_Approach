<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/character/">
    <title>选择规则 · 车卡生成</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="top-ornament"></div>

        <header class="header">
            <div class="logo-icon">🎲</div>
            <h1>选择规则</h1>
            <p class="tagline">选择你要使用的跑团规则，开始生成角色卡</p>
        </header>

        <main class="rule-grid">
            <div class="rule-card" data-rule="dnd_5r">
                <div class="rule-icon">⚔️</div>
                <h2>DND 5R</h2>
                <p>龙与地下城 第五版 重置版</p>
            </div>

            <div class="rule-card" data-rule="dnd_5e">
                <div class="rule-icon">🛡️</div>
                <h2>DND 5E</h2>
                <p>龙与地下城 第五版</p>
            </div>

            <div class="rule-card" data-rule="coc">
                <div class="rule-icon">🔦</div>
                <h2>COC</h2>
                <p>克苏鲁的呼唤</p>
            </div>

            <div class="rule-card" data-rule="pf">
                <div class="rule-icon">⚜️</div>
                <h2>PF</h2>
                <p>开拓者 Pathfinder</p>
            </div>
        </main>

        <footer class="footer">
            <p><a href="/">← 返回主页</a></p>
        </footer>

        <div class="bottom-ornament"></div>
    </div>

</body>
</html>
