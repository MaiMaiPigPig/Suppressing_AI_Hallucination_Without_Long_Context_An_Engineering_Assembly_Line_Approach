<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许愿池</title>
    <link rel="stylesheet" href="/backstage/data_maintenance/data_maintenance.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h2>许愿池</h2>
            <div class="header-actions">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索心愿内容...">
                <button class="layui-btn layui-btn-sm" id="searchBtn">搜索</button>
            </div>
        </div>

        <table id="wishTable" lay-filter="wishTable"></table>
    </div>

    <script type="text/html" id="topToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm" lay-event="refresh">刷新</button>
        </div>
    </script>

    <script type="text/html" id="wishToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="receive">收到</button>
            <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="complete">完成</button>
            <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
        </div>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
    <script src="/backstage/wish/wish.js"></script>
</body>
</html>
